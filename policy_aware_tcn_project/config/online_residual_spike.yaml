paths:
  raw_data: data/raw/GS.csv
  processed_features: outputs/weather_error_experiment/features_weather_error.csv
  model_dir: outputs/weather_error_train2024q2/models
  prediction_dir: outputs/online_residual_spike/predictions
  report_dir: outputs/online_residual_spike/reports
columns:
  datetime: Date
  target: Price
  exogenous:
  - 发电总出力预测
  - 竞价空间
  - 统一负荷预测
  - 抽蓄
  - 统一新能源预测
  - 联络线计划
data:
  encoding: utf-8-sig
  expected_slots_per_day: 96
  slot_minutes: 15
split:
  train_start: '2024-04-01'
  train_end: '2025-09-30'
  valid_start: '2025-10-01'
  valid_end: '2025-11-30'
  test_start: '2025-12-01'
  test_end: '2025-12-31'
features:
  include_market_features: true
metrics:
  price_floor: 40.0
  price_range: 1000.0
  daily_accuracy_threshold: 0.85
online_residual_calibrator:
  min_history_days: 10
  window_days: 5
  group: pred_bin
  shrink: 0.5
  clip_value: 160.0
  min_prediction: 60.0
  max_floor_probability: 0.8
  prediction_bins:
  - 40
  - 60
  - 100
  - 160
  - 240
  - 360
  - 500
  - 1000
  spike_residual:
    enabled: true
    group: spike_state
    min_probability: 0.08
    window_days: 5
    min_history_days: 10
    shrink: 0.5
    clip_value: 240.0
    quantile: 0.5
    min_history_rows: 8
