paths:
  raw_data: data/raw/GS.csv
  processed_features: outputs/weather_error_experiment/features_weather_error.csv
  model_dir: outputs/weather_error_train_to_oct/models
  prediction_dir: outputs/residual_calibrated_novvalid/predictions
  report_dir: outputs/residual_calibrated_novvalid/reports
columns:
  datetime: Date
  target: Price
  exogenous:
  - 发电总出力预测
  - 竞价空间
  - 统一负荷预测
  - 抽蓄
  - 统一新能源预测
  - 联络线计划
data:
  encoding: utf-8-sig
  expected_slots_per_day: 96
  slot_minutes: 15
  target_cleaning:
    enabled: true
    cap_values_as_missing:
    - 0.0
    constant_run_exempt_values:
    - 40.0
    - 1000.0
    constant_run_min_length: 672
split:
  train_start: '2024-04-01'
  train_end: '2025-10-31'
  valid_start: '2025-11-01'
  valid_end: '2025-11-30'
  test_start: '2025-12-01'
  test_end: '2025-12-31'
features:
  price_lags_days:
  - 1
  - 2
  - 7
  - 14
  rolling_windows_days:
  - 3
  - 7
  - 14
  include_market_features: true
  include_floor_features: true
  floor_price: 40.0
  floor_run_windows_days:
  - 1
  - 3
  - 7
  long_floor_run_slots: 16
  include_exogenous_quantile_features: true
  exogenous_quantile_source_columns:
  - 发电总出力预测
  - 竞价空间
  - 统一负荷预测
  - 抽蓄
  - 统一新能源预测
  - 联络线计划
  exogenous_quantile_windows_days:
  - 7
  - 14
  - 28
  exogenous_quantile_levels:
  - 0.1
  - 0.5
  - 0.9
  include_exogenous_quantile_spreads: true
  include_derived_quantile_features: true
  include_calendar_features: true
  include_cyclic_slot_features: true
metrics:
  price_floor: 40.0
  price_range: 1000.0
  daily_accuracy_threshold: 0.85
forecast:
  target_date: '2026-04-28'
  output_prefix: policy_aware_tcn_future_24h
weather:
  enabled: false
  provider: open_meteo_previous_runs
  cache_dir: outputs/weather_cache
  timezone: Asia/Shanghai
  request_timeout_seconds: 30
  skip_failed_stations: true
  forecast_leads_days:
  - 1
  - 2
  - 3
  variables:
  - temperature_2m
  - wind_speed_10m
  - shortwave_radiation
  - cloud_cover
  - precipitation
  - relative_humidity_2m
  stations:
  - name: xian
    latitude: 34.34
    longitude: 108.94
  - name: yulin
    latitude: 38.29
    longitude: 109.73
  - name: yanan
    latitude: 36.59
    longitude: 109.49
  - name: baoji
    latitude: 34.36
    longitude: 107.24
  - name: hanzhong
    latitude: 33.07
    longitude: 107.02
  - name: ankang
    latitude: 32.68
    longitude: 109.03
  - name: weinan
    latitude: 34.50
    longitude: 109.51
  - name: xianyang
    latitude: 34.33
    longitude: 108.71
deep_model:
  seed: 42
state_gbm:
  early_stopping_rounds: 80
residual_calibrator:
  objective: regression
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 30
  subsample: 0.9
  colsample_bytree: 0.7
  reg_lambda: 5.0
  early_stopping_rounds: 50
  selection_tolerance: 0.0
  refit_after_validation: false
  shrink_grid:
  - 0.75
  - 1.0
  clip_grid:
  - 160
  - 220
  - 300
  min_prediction_grid:
  - 40
  - 80
  - 150
  max_floor_probability_grid:
  - 0.2
  - 0.4
  - 0.8
  - 1.1
  positive_only_grid:
  - false
