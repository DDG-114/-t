[project]
name = "policy-aware-tcn-project"
version = "0.1.0"
description = "Standalone policy-aware TCN for 96-point day-ahead electricity price forecasting."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "pytest>=7.4",
    "torch>=2.2",
    "typeguard>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
