[project]
name = "dayahead-epf-agent-project"
version = "0.1.0"
description = "Day-ahead electricity price forecasting pipeline with baselines and slot-wise LightGBM."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "torch>=2.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
