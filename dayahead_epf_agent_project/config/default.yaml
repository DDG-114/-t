paths:
  raw_data: data/raw/GS.csv
  processed_features: data/processed/features.csv
  model_dir: outputs/models
  prediction_dir: outputs/predictions
  report_dir: outputs/reports

columns:
  datetime: Date
  target: Price
  exogenous:
    - 发电总出力预测
    - 竞价空间
    - 统一负荷预测
    - 抽蓄
    - 统一新能源预测
    - 联络线计划

data:
  encoding: utf-8-sig
  expected_slots_per_day: 96
  slot_minutes: 15
  drop_missing_target_for_training: true
  target_cleaning:
    enabled: true
    # Market floor is 40 in this dataset, so zero prices are treated as invalid
    # target placeholders. 1000 is treated as an abnormal cap value.
    cap_values_as_missing: [0.0, 1000.0]
    # 40 is the known market floor price, so short floor-price runs are valid.
    # Only ultra-long unchanged segments are treated as suspicious labels.
    # 672 slots = 7 days at 15-minute resolution.
    constant_run_min_length: 672

split:
  train_start: '2025-01-01'
  train_end: '2025-09-30'
  valid_start: '2025-10-01'
  valid_end: '2025-11-30'
  test_start: '2025-12-01'
  test_end: '2025-12-31'

features:
  price_lags_days: [1, 2, 7, 14]
  rolling_windows_days: [3, 7, 14]
  include_market_features: true
  include_calendar_features: true
  include_cyclic_slot_features: true

metrics:
  price_floor: 40.0
  price_range: 1000.0
  daily_accuracy_threshold: 0.85

forecast:
  # The latest day in the bundled data has missing Price values and is treated
  # as the default 24h day-ahead forecast target.
  target_date: '2026-04-28'
  output_prefix: future_24h

model:
  type: slot_lightgbm
  random_state: 42
  sample_weight:
    enabled: true
    mode: inverse_target_floor
  clip_prediction_min: 40.0
  clip_prediction_max: 1000.0
  lightgbm_params:
    objective: regression_l1
    learning_rate: 0.03
    n_estimators: 250
    num_leaves: 31
    max_depth: -1
    min_child_samples: 10
    subsample: 0.9
    colsample_bytree: 0.9
    reg_alpha: 0.1
    reg_lambda: 0.5
    random_state: 42
    n_jobs: -1
    verbosity: -1

deep_model:
  type: policy_aware_tcn
  seed: 42
  history_days: 14
  horizon: 96
  batch_size: 16
  epochs: 120
  patience: 20
  min_delta: 0.0001
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  lambda_ramp: 0.10
  nll_weight: 0.05
  add_missing_indicators: true
  default_policy_regime: 0.0
  policy_regime_by_year:
    2025: 0.0
    2026: 1.0
  year_bounds:
    2025:
      min: 40.0
      max: 1000.0
    2026:
      min: 0.0
      max: 1000.0
  synthetic_zero_floor:
    enabled: true
    policy_regime: 1.0
    max_source_price: 120.0
    target_upper: 80.0
    min_changed_slots: 8
    sample_weight: 0.35
  tcn:
    channels: 64
    kernel_size: 3
    dilations: [1, 2, 4, 8, 16, 32]
    dropout: 0.15
    future_layers: 2
    static_hidden: 32
    residual_scale: 200.0
    output_sigma: true
